name: Legacy Public Rollback

on:
  workflow_dispatch:
    inputs:
      confirm_legacy_rollback:
        description: Type ROLLBACK to deploy the preserved pre-consolidation site
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: procuresignal-legacy-public-rollback
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy preserved legacy site
    if: github.event.inputs.confirm_legacy_rollback == 'ROLLBACK'
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: "github-pages-${{ github.run_id }}-${{ github.run_attempt }}"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: legacy-public-rollback-2026-07-19

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
